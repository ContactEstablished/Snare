name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Each step tees its output and turns error lines into annotations,
      # so failures are readable from the run summary and the API.
      - name: Restore
        run: |
          dotnet restore Snare.slnx 2>&1 | Tee-Object -FilePath restore.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path restore.log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Build
        run: |
          dotnet build Snare.slnx --configuration Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Test
        run: |
          dotnet test Snare.slnx --configuration Release --no-build 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path test.log -Pattern '(: error |^\s*Failed |\[FAIL\]|Assert\.)' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
