name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Snare.slnx

      - name: Build
        run: dotnet build Snare.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Snare.slnx --configuration Release --no-build
